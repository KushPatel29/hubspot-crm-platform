[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hubspot-crm-platform"
version = "0.1.0"
description = "HubSpot CRM developer platform: CRM-as-code, per-business HubSpot apps, and a Salesforce-ready model"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
include = ["crm_platform*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ISC"]

[tool.mypy]
files = ["crm_platform", "scripts"]
python_version = "3.12"
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
