name: CRM platform checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli-install:
    name: CLI installation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Both pinned CLIs must start without an account
        run: |
          node node_modules/@salesforce/cli/bin/run.js --version
          node node_modules/@hubspot/cli/bin/hs.js --version

  apex-static-analysis:
    name: Apex security, error-prone and performance rules (PMD)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Download the checksum-pinned PMD distribution
        run: |
          curl --fail --location --retry 2 https://github.com/pmd/pmd/releases/download/pmd_releases%2F7.28.0/pmd-dist-7.28.0-bin.zip --output "$RUNNER_TEMP/pmd.zip"
          echo "f974ba571f7bc01c73fffe11bade25fbc1f438698f9e9c00e416e8d65e9fbac2  $RUNNER_TEMP/pmd.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/pmd.zip" -d "$RUNNER_TEMP"
      - name: Scan every Apex class and trigger; any finding fails
        env:
          PMD_APEX_ROOT_DIRECTORY: ${{ github.workspace }}/salesforce/meridian
        run: |
          mkdir -p artifacts
          "$RUNNER_TEMP/pmd-bin-7.28.0/bin/pmd" check --dir salesforce/meridian/code --rulesets salesforce/pmd-ruleset.xml --format json --report-file artifacts/pmd.json --no-cache
      - name: Retain the full static-analysis report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apex-pmd-report
          path: artifacts/pmd.json
          if-no-files-found: error
          retention-days: 14

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: python -m pip install -e . -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check crm_platform tests scripts
      - name: Types (mypy, zero errors)
        run: python -m mypy
      - name: Model, loader, schema engine, Salesforce compilation, JS parity (coverage gate 85%)
        run: python -m pytest -q --cov=crm_platform --cov-report=term --cov-fail-under=85
      - name: Committed Salesforce metadata matches the models
        run: python -m crm_platform.salesforce.metadata --check

  hubspot-apps:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hubspot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hubspot/package-lock.json
      - run: npm ci
      - name: Card and function tests (HubSpot's test renderer, signed requests, resumable offers)
        run: npm test
      - name: Cards typecheck against @hubspot/ui-extensions
        run: npm run typecheck
      - name: Generated HubSpot projects match their sources
        run: npm run check

  salesforce:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: salesforce/meridian
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: salesforce/meridian/package-lock.json
      - run: npm ci
      - name: Lightning Web Component tests (the Salesforce twin of the deal margin card)
        run: npm test
      - name: Apex parses, has its metadata, and every class is exercised by a test
        run: npm run check:apex
