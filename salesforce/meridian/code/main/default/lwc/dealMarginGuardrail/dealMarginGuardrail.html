<template>
    <lightning-card title="Deal margin guardrail" icon-name="standard:opportunity">
        <lightning-button-icon slot="actions" icon-name="utility:refresh" alternative-text="Rescore"
            onclick={handleRefresh}></lightning-button-icon>
        <div class="slds-p-horizontal_medium">
            <template lwc:if={loading}>
                <lightning-spinner alternative-text="Scoring the deal's lines" size="small"></lightning-spinner>
            </template>
            <template lwc:elseif={error}>
                <p class="error slds-text-color_error">{error}</p>
            </template>
            <template lwc:elseif={noLines}>
                <p class="empty">This opportunity has no priced line items yet.</p>
                <p class="unscored slds-text-body_small">{unscoredText}</p>
            </template>
            <template lwc:else>
                <div class="slds-grid slds-gutters slds-m-bottom_small">
                    <div class="slds-col">
                        <p class="slds-text-title_caps">Blended margin</p>
                        <p class="blended slds-text-heading_medium">{blended}</p>
                    </div>
                    <div class="slds-col">
                        <p class="slds-text-title_caps">Margin under target</p>
                        <p class="gap slds-text-heading_medium">{gap}</p>
                    </div>
                </div>
                <!-- Stacked, not a table: on a record page this sits in a narrow column, where a four-column table
                     pushed the verdict out of sight. -->
                <div class={alertClass} role="alert">
                    <p class="headline slds-text-title_bold">{headline}</p>
                    <p class="worst slds-m-top_xx-small">{worstText}</p>
                </div>
                <ul class="lines slds-has-dividers_top-space slds-m-top_small" aria-label="Lines">
                    <template for:each={rows} for:item="row">
                        <li key={row.id} class="line slds-item">
                            <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-start">
                                <p class="name slds-col slds-p-right_x-small">{row.name}</p>
                                <span class={row.badgeClass}>{row.verdict}</span>
                            </div>
                            <p class="figures slds-text-body_small slds-text-color_weak">{row.figures}</p>
                        </li>
                    </template>
                </ul>
                <p class="unscored slds-text-body_small slds-m-top_x-small">{unscoredText}</p>
                <p class="basis slds-text-body_small slds-text-color_weak">{result.basis}</p>
            </template>
        </div>
    </lightning-card>
</template>
